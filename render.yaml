services:
  - type: web
    name: clipper
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: bash start.sh
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: STRIPE_PRICE_SUPER_PREMIUM
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
